<style>
  /* Helvetica World: sube HelveticaWorld-Regular.woff2 y HelveticaWorld-Bold.woff2 junto a este archivo */
  @font-face { font-family: 'Helvetica World'; font-weight: 400; font-style: normal; font-display: swap;
    src: local('Helvetica World'), local('HelveticaWorld-Regular'), url('HelveticaWorld-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Helvetica World'; font-weight: 700; font-style: normal; font-display: swap;
    src: local('Helvetica World Bold'), local('HelveticaWorld-Bold'), url('HelveticaWorld-Bold.woff2') format('woff2'); }
  :root {
    --bg: #000;
    --text: #e4e4e4;
    --muted: #9a9a9a;
    --dim: #8a8a8a;
    --line: #4a4a4a;
    --line-strong: #e4e4e4;
    --quote: #bdbdbd;
    --sans: 'Helvetica World', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --logo: url("logo.svg");   /* si algún día usas PNG, cambia a logo.png */
    --ease: cubic-bezier(.22,.8,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: var(--sans); color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body.is-loading { overflow: hidden; }

  /* ================= Logo cromado 3D ================= */
  .scene { width: var(--s); height: var(--s); perspective: 900px; position: relative; }
  .rig { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: turn 10s infinite; }
  @keyframes turn {
    0%, 55% { transform: rotateY(0deg); animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
    100%    { transform: rotateY(360deg); }
  }
  .layer { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
    background: linear-gradient(115deg, #fff 0%, #9b9b9b 14%, #1b1b1b 30%, #e6e6e6 46%, #6a6a6a 60%, #fafafa 76%, #7a7a7a 90%, #d0d0d0 100%) 0 0 / 300% 300%;
    animation: sweep 7s linear infinite alternate; }
  .layer.front { transform: translateZ(.5px); }
  .layer.back  { transform: rotateY(180deg) translateZ(.5px); }
  @keyframes sweep { to { background-position: 100% 100%; } }
  /* LOGO_STYLE = 'original': usa tu imagen tal cual, sin el efecto cromado */
  body.logo-original .layer { background: var(--logo) center / contain no-repeat; -webkit-mask: none; mask: none; animation: none; }

    /* ================= Fondo liso ================= */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #000; }

  /* ================= Cursor personalizado ================= */
  html.has-cursor, html.has-cursor * { cursor: none !important; }
  .cur-dot { position: fixed; left: 0; top: 0; z-index: 300; pointer-events: none; opacity: 0; mix-blend-mode: difference;
    width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff;
    transition: width .3s var(--ease), height .3s var(--ease), margin .3s var(--ease), opacity .4s; }
  .cur-dot.hot { width: 12px; height: 12px; margin: -6px 0 0 -6px; }
  .cur-on { opacity: 1; }

  /* ================= Pantalla de carga ================= */
  .loader {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.2s var(--ease), transform 1.2s var(--ease);
  }
  .loader .scene { --s: clamp(150px, 34vw, 230px); opacity: 0;
    animation: arrive 2.4s cubic-bezier(.14,.8,.24,1) .1s forwards; }
  @keyframes arrive {
    0%   { opacity: 0; transform: scale(.12); }
    30%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  .loader.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
  /* ================= Página ================= */
  .page {
    position: relative; z-index: 3; min-height: inherit;
    padding: calc(72px + env(safe-area-inset-top)) 24px calc(44px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .stack { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  .hero .scene { --s: clamp(120px, 22vw, 150px); }

  .reveal { opacity: 0; transform: translateY(16px); width: 100%; }
  .ready .reveal {
    opacity: 1; transform: none;
    transition: opacity 1.1s var(--ease), transform 1.1s var(--ease);
    transition-delay: calc(.25s + var(--i, 0) * .14s);
  }

  .season { margin-top: 44px; display: flex; align-items: center; gap: 14px; }
  .season::before, .season::after { content: ""; flex: 1; height: 1px; }
  .season::before { background: linear-gradient(90deg, transparent, var(--line)); }
  .season::after  { background: linear-gradient(270deg, transparent, var(--line)); }
  .season span { color: #c4c4c4; font-size: 12px; font-weight: 400; letter-spacing: .42em; white-space: nowrap; }

  .links { margin-top: 44px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    position: relative; overflow: hidden; isolation: isolate; border-radius: 14px;
    min-height: 54px; display: flex; align-items: center; justify-content: center;
    padding-left: .38em; border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-size: 12px; font-weight: 400; letter-spacing: .38em;
    transition: border-color .5s var(--ease), letter-spacing .5s var(--ease);
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.11));
    transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease);
  }
  .btn:hover, .btn:focus-visible { border-color: var(--line-strong); letter-spacing: .46em; outline: none; }
  .btn:hover::before, .btn:focus-visible::before { transform: scaleX(1); }

  .socials { margin: 40px 0 0; padding: 0; list-style: none; display: flex; gap: 14px; justify-content: center; }
  .socials a { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: color .3s, transform .5s var(--ease); }
  .socials a:hover, .socials a:focus-visible { color: #fff; transform: translateY(-3px); outline: none; }
  .socials a:focus-visible { box-shadow: 0 0 0 1px var(--line); }
  .socials i { display: block; width: 22px; height: 22px; background: currentColor;
    -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; }

  .rule { margin: 36px auto 0; width: 40px; height: 1px; background: var(--line); }
  .legal { margin: 24px 0 0; color: var(--dim); font-size: 9px; font-weight: 400; letter-spacing: .24em; text-align: center; }

  /* ================= Sonido ================= */
  .sound {
    position: fixed; z-index: 70; top: calc(28px + env(safe-area-inset-top)); right: 36px;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; border-radius: 50%; cursor: pointer; color: var(--muted);
    opacity: 0; transition: opacity .8s .4s, color .3s;
  }
  .ready .sound { opacity: 1; }
  .sound:hover, .sound:focus-visible { color: #fff; outline: none; }
  .sound:focus-visible { box-shadow: 0 0 0 1px var(--line); }
  .sound .on { display: none; }
  .sound[aria-pressed="true"] .on { display: inline; }
  .sound[aria-pressed="true"] .off { display: none; }

  /* ================= Easter egg: ARCHIVE 01 ================= */
  .hero .scene { -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .egg { position: fixed; inset: 0; z-index: 250; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .6s var(--ease); }
  .egg[hidden] { display: none; }
  .egg.open { opacity: 1; }
  .egg-panel {
    position: relative; overflow: hidden; width: 100%; max-width: 560px; padding: 44px 40px 40px;
    text-align: center; text-transform: uppercase;
    background: rgba(0,0,0,.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.15);
    opacity: 0; transform: scale(.96); transition: opacity .6s var(--ease), transform .6s var(--ease);
  }
  .egg.open .egg-panel { opacity: 1; transform: none; }
  .egg-head { margin: 0; font: 400 11px/1.6 ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; letter-spacing: .3em; color: var(--muted); }
  .egg-quote { margin: 30px 0 0; font: 400 15px/1.9 var(--sans); letter-spacing: .22em; color: #ececec; }
  .egg-season { margin: 30px 0 0; font: 400 10px/1.6 var(--sans); letter-spacing: .32em; color: var(--muted); }
  .egg-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 1px; background: rgba(255,255,255,.4);
    transform: scaleX(1); transform-origin: left; }
  .egg.open .egg-bar { transform: scaleX(0); transition: transform 4.5s linear; }

  /* ================= Táctil / celular ================= */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  .btn, .socials a, .sound { touch-action: manipulation; }
  .rig { will-change: transform; }

  /* En pantallas táctiles no existe el hover real: se evita que quede "pegado" tras tocar */
  @media (hover: none) {
    .btn:hover, .btn:focus-visible { border-color: var(--line); letter-spacing: .38em; }
    .btn:hover::before, .btn:focus-visible::before { transform: scaleX(0); }
    .socials a:hover, .socials a:focus-visible { color: var(--muted); transform: none; }
    .sound:hover, .sound:focus-visible { color: var(--muted); }
    /* respuesta inmediata al toque */
    .btn:active { border-color: var(--line-strong); }
    .btn:active::before { transform: scaleX(1); transition-duration: .2s; }
    .socials a:active, .sound:active { color: #fff; }
  }
  /* Menos trabajo para la GPU en celulares: el brillo cromado queda fijo, el giro se mantiene */
  @media (hover: none), (max-width: 600px) {
    .layer { animation: none; background-position: 35% 35%; }
  }

  @media (max-width: 480px) {
    .sound { right: 16px; top: calc(22px + env(safe-area-inset-top)); }
    .egg-panel { padding: 36px 22px 32px; }
    .egg-quote { font-size: 13px; letter-spacing: .16em; }
    .egg-head { letter-spacing: .2em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rig { animation: none; transform: rotateY(-22deg); }
    .layer { animation: none !important; }
    .reveal, .ready .reveal { transition: none; transform: none; filter: none; }
    .loader { transition-duration: .01s; }
    .egg, .egg-panel, .egg-bar { transition: none !important; }
  }
</style>
</head>

<body class="is-loading">

<script>
(function () {
  /* ============ CONFIGURACIÓN ============ */
  var MIN_LOAD_MS  = 3000;   // duración mínima de la pantalla de carga (la llegada del logo dura ~2.4 s)
  var LOGO_STYLE   = 'chrome'; // 'chrome': efecto cromado animado sobre tu logo. 'original': usa tu imagen tal cual.
  var VOLUME       = 0.7;    // volumen final de la canción (0 a 1)
  var FADE_MS      = 2500;   // fade-in de la música

  var body   = document.body;
  var loader = document.getElementById('loader');
  var btn    = document.getElementById('sound');
  var audio  = document.getElementById('audio');
  document.body.classList.add('logo-' + LOGO_STYLE);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ Logo: cara frontal y trasera ============ */
  document.querySelectorAll('[data-logo]').forEach(function (scene) {
    var rig = document.createElement('div');
    rig.className = 'rig';
    ['front', 'back'].forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'layer ' + c;
      rig.appendChild(d);
    });
    scene.appendChild(rig);
  });

  /* ============ Audio ============ */
  var wantsSound = true;
  try { wantsSound = localStorage.getItem('cvnt-sound') !== 'off'; } catch (e) {}
  var audioOk = true, playing = false, fadeRaf = 0;
  audio.volume = 0;
  audio.addEventListener('error', function () { audioOk = false; render(false); });

  function render(on) {
    playing = on;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? 'Sound on. Click to mute' : 'Sound off. Click to turn on');
  }
  function fade(to, ms, done) {
    cancelAnimationFrame(fadeRaf);
    var from = audio.volume, t0 = performance.now();
    (function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      audio.volume = from + (to - from) * k;
      if (k < 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  function play() {
    if (!audioOk) return Promise.resolve(false);
    return audio.play().then(function () { fade(VOLUME, FADE_MS); render(true); return true; })
                       .catch(function () { render(false); return false; });
  }
  function pause() { fade(0, 600, function () { audio.pause(); }); render(false); }
  function save(v) { try { localStorage.setItem('cvnt-sound', v); } catch (e) {} }

  btn.addEventListener('click', function () {
    if (playing) { wantsSound = false; save('off'); pause(); }
    else { wantsSound = true; save('on'); play(); }
  });

  /* La música se pausa al salir de la pestaña y vuelve al regresar */
  var resumeOnVisible = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (playing) { resumeOnVisible = true; audio.pause(); }
    } else if (resumeOnVisible) {
      resumeOnVisible = false;
      audio.play().catch(function () { render(false); });
    }
  });
  window.addEventListener('pagehide', function () { audio.pause(); });

  /* ============ Carga y entrada ============ */
  var domReady = new Promise(function (res) {
    if (document.readyState === 'complete') res(); else window.addEventListener('load', res);
  });
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var minTime = new Promise(function (res) { setTimeout(res, MIN_LOAD_MS); });
  function reveal() {
    loader.classList.add('out');
    body.classList.remove('is-loading');
    body.classList.add('ready');
    setTimeout(function () { loader.remove(); }, 1500);
  }

  Promise.all([domReady, fontsReady, minTime]).then(function () {
    reveal();
    if (!wantsSound) return;
    // Los navegadores suelen bloquear el audio automático: si falla, suena en el primer toque o clic
    play().then(function (ok) {
      if (ok) return;
      var evs = ['pointerdown', 'keydown', 'touchend'];
      var kick = function () {
        evs.forEach(function (ev) { window.removeEventListener(ev, kick); });
        if (wantsSound && !playing) play();
      };
      evs.forEach(function (ev) { window.addEventListener(ev, kick, { passive: true }); });
    });
  });

  /* ============ Easter egg: 3 clics en 1.5 s sobre el logo ============ */
  (function () {
    var CLICKS = 3, WINDOW_MS = 1500, SHOW_MS = 4500;
    var egg = document.getElementById('egg');
    var logo = document.querySelector('.hero .scene');
    var stamps = [], hideTimer = 0, removeTimer = 0;

    function open() {
      if (!egg.hidden && egg.classList.contains('open')) return;
      clearTimeout(removeTimer);
      egg.hidden = false;
      void egg.offsetWidth;                       // reinicia las transiciones
      egg.classList.add('open');
      hideTimer = setTimeout(close, SHOW_MS);
    }
    function close() {
      clearTimeout(hideTimer);
      egg.classList.remove('open');
      removeTimer = setTimeout(function () { egg.hidden = true; }, 700);
    }

    logo.addEventListener('click', function () {
      var now = Date.now();
      stamps.push(now);
      stamps = stamps.filter(function (t) { return now - t <= WINDOW_MS; });
      if (stamps.length >= CLICKS) { stamps = []; open(); }
    });
    egg.addEventListener('click', function (e) { if (e.target === egg) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && egg.classList.contains('open')) close(); });
  })();

  /* ============ Cursor personalizado (solo con mouse) ============ */
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var dot = document.getElementById('cur-dot'), shown = false;
    document.documentElement.classList.add('has-cursor');
    window.addEventListener('pointermove', function (e) {
      dot.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
      if (!shown) { shown = true; dot.classList.add('cur-on'); }
      dot.classList.toggle('hot', !!(e.target.closest && e.target.closest('a, button')));
    }, { passive: true });
    document.addEventListener('mouseleave', function () { dot.classList.remove('cur-on'); shown = false; });
  }
})();
</script>
</body>
</html>
