<style>
  :root {
    --bg: #000;
    --text: #e4e4e4;
    --muted: #9a9a9a;
    --dim: #8a8a8a;
    --line: #4a4a4a;
    --line-strong: #e4e4e4;
    --quote: #bdbdbd;
    --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --gothic: 'UnifrakturCook', serif;
    --ease: cubic-bezier(.22,.8,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: var(--sans); color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body.is-loading { overflow: hidden; }

  /* ================= Logo cromado 3D ================= */
  .scene { width: var(--s); height: var(--s); perspective: 900px; position: relative; }
  .rig {
    --t: calc(var(--s) * .007);
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    animation: spin 16s linear infinite;
  }
  @keyframes spin { to { transform: rotateY(360deg); } }
  .layer { position: absolute; inset: 0; }
  .layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face .shape { fill: url(#chrome); stroke: #fff; stroke-width: .5; stroke-linejoin: miter; }
  .side .shape { fill: #2a2a2a; stroke: #7d7d7d; stroke-width: .4; stroke-linejoin: miter; }
  .halo {
    position: absolute; left: 50%; top: 50%;
    width: calc(var(--s) * 2.2); height: calc(var(--s) * 2.2);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,.17) 0%, rgba(255,255,255,.05) 35%, transparent 62%);
    animation: pulse 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse { 50% { opacity: .55; transform: translate(-50%, -50%) scale(.92); } }
  .floor {
    position: absolute; left: 50%; bottom: calc(var(--s) * -.16);
    width: calc(var(--s) * .9); height: calc(var(--s) * .12);
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(255,255,255,.14), transparent 70%);
    filter: blur(6px);
  }

  /* ================= Fondo liso ================= */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: #000; }

  /* ================= Cursor personalizado ================= */
  html.has-cursor, html.has-cursor * { cursor: none !important; }
  .cur-dot { position: fixed; left: 0; top: 0; z-index: 300; pointer-events: none; opacity: 0; mix-blend-mode: difference;
    width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff;
    transition: width .3s var(--ease), height .3s var(--ease), margin .3s var(--ease), opacity .4s; }
  .cur-dot.hot { width: 22px; height: 22px; margin: -11px 0 0 -11px; }
  .cur-on { opacity: 1; }

  /* ================= Pantalla de carga ================= */
  .loader {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.3s var(--ease), transform 1.3s var(--ease), filter 1.3s var(--ease);
  }
  .loader .scene { --s: clamp(150px, 34vw, 230px); opacity: 0;
    animation: arrive 3.4s cubic-bezier(.14,.8,.24,1) .2s forwards; }
  @keyframes arrive {
    0%   { opacity: 0; transform: scale(.04); filter: blur(16px) brightness(.25); }
    25%  { opacity: 1; }
    100% { opacity: 1; transform: none; filter: none; }
  }
  .loader.out { opacity: 0; transform: scale(1.08); filter: blur(6px); pointer-events: none; }
  .enter {
    margin-top: clamp(48px, 9vh, 80px);
    min-height: 60px; padding: 0 64px 0 calc(64px + .6em);
    background: transparent; border: 1px solid rgba(255,255,255,.4); cursor: pointer;
    color: #fff; font: 300 13px/1 var(--sans); letter-spacing: .6em;
    opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity 1.2s, transform 1.2s var(--ease), border-color .6s, background .6s, letter-spacing .7s var(--ease);
  }
  .enter.show { opacity: 1; transform: none; pointer-events: auto; animation: breathe 3.6s ease-in-out 1.2s infinite; }
  @keyframes breathe { 0%, 100% { border-color: rgba(255,255,255,.32); } 50% { border-color: rgba(255,255,255,.8); } }
  .enter:hover, .enter:focus-visible { outline: none; animation: none; border-color: #fff; background: rgba(255,255,255,.06); letter-spacing: .75em; }

  /* ================= Página ================= */
  .page {
    position: relative; z-index: 3; min-height: inherit;
    padding: calc(72px + env(safe-area-inset-top)) 24px calc(44px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
  }
  .stack { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
  .hero .scene { --s: clamp(120px, 22vw, 150px); }

  .reveal { opacity: 0; transform: translateY(16px); filter: blur(5px); width: 100%; }
  .ready .reveal {
    opacity: 1; transform: none; filter: none;
    transition: opacity 1.1s var(--ease), transform 1.1s var(--ease), filter 1.1s var(--ease);
    transition-delay: calc(.25s + var(--i, 0) * .14s);
  }

  .quote {
    margin: 34px 0 0; text-align: center; white-space: nowrap;
    font-family: var(--gothic); font-size: clamp(14px, 3.9vw, 21px); line-height: 1.35;
    color: var(--quote); letter-spacing: .03em;
  }
  .season { margin-top: 24px; display: flex; align-items: center; gap: 14px; }
  .season::before, .season::after { content: ""; flex: 1; height: 1px; }
  .season::before { background: linear-gradient(90deg, transparent, var(--line)); }
  .season::after  { background: linear-gradient(270deg, transparent, var(--line)); }
  .season span { color: var(--muted); font-size: 10px; font-weight: 300; letter-spacing: .34em; white-space: nowrap; }

  .links { margin-top: 44px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    position: relative; overflow: hidden; isolation: isolate;
    min-height: 54px; display: flex; align-items: center; justify-content: center;
    padding-left: .38em; border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    font-size: 12px; font-weight: 300; letter-spacing: .38em;
    transition: border-color .5s var(--ease), letter-spacing .5s var(--ease);
  }
  .btn::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,.11));
    transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease);
  }
  .btn:hover, .btn:focus-visible { border-color: var(--line-strong); letter-spacing: .46em; outline: none; }
  .btn:hover::before, .btn:focus-visible::before { transform: scaleX(1); }

  .socials { margin: 40px 0 0; padding: 0; list-style: none; display: flex; gap: 14px; justify-content: center; }
  .socials a { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); transition: color .3s, transform .5s var(--ease); }
  .socials a:hover, .socials a:focus-visible { color: #fff; transform: translateY(-3px); outline: none; }
  .socials a:focus-visible { box-shadow: 0 0 0 1px var(--line); }
  .socials svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

  .rule { margin: 36px auto 0; width: 40px; height: 1px; background: var(--line); }
  .legal { margin: 24px 0 0; color: var(--dim); font-size: 9px; font-weight: 300; letter-spacing: .24em; text-align: center; }

  /* ================= Sonido ================= */
  .sound {
    position: fixed; z-index: 70;
    top: calc(30px + env(safe-area-inset-top)); right: 40px;
    min-height: 44px; display: flex; align-items: center; gap: 12px;
    background: none; border: 0; cursor: pointer;
    color: var(--muted); font: 300 11px/1 var(--sans); letter-spacing: .32em;
    opacity: 0; transition: opacity 1.2s 1.2s, color .3s;
  }
  .ready .sound { opacity: 1; }
  .sound:hover, .sound:focus-visible { color: #fff; outline: none; }
  .sound:focus-visible #sound-label { text-decoration: underline; text-underline-offset: 6px; }
  .eq { width: 18px; height: 14px; display: flex; align-items: center; justify-content: space-between; }
  .eq b { display: block; width: 1px; height: 100%; background: currentColor; transform: scaleY(.3); transform-origin: center; }
  .sound[aria-pressed="true"] .eq b { animation: eq 1.1s ease-in-out infinite; }
  .sound[aria-pressed="true"] .eq b:nth-child(2) { animation-delay: -.3s; }
  .sound[aria-pressed="true"] .eq b:nth-child(3) { animation-delay: -.7s; }
  .sound[aria-pressed="true"] .eq b:nth-child(4) { animation-delay: -.5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

  @media (max-width: 480px) {
    .sound { right: 20px; top: calc(26px + env(safe-area-inset-top)); }
    .enter { padding: 0 40px 0 calc(40px + .6em); font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rig { animation: none; transform: rotateY(-22deg); }
    .halo, .enter.show, .sound .eq b { animation: none !important; }
    .reveal, .ready .reveal { transition: none; transform: none; filter: none; }
    .loader { transition-duration: .01s; }
  }
</style>
</head>

<script>
(function () {
  /* ============ CONFIGURACIÓN ============ */
  var ENTER_GATE   = true;   // true: aparece "ENTER" al terminar de cargar (garantiza que la música suene).
                             // false: entra solo e intenta reproducir; muchos navegadores lo bloquean.
  var MIN_LOAD_MS  = 4200;   // tiempo mínimo que se ve la pantalla de carga
  var VOLUME       = 0.7;    // volumen final de la canción (0 a 1)
  var FADE_MS      = 2500;   // fade-in de la música

  var body   = document.body;
  var loader = document.getElementById('loader');
  var enter  = document.getElementById('enter');
  var btn    = document.getElementById('sound');
  var label  = document.getElementById('sound-label');
  var audio  = document.getElementById('audio');
  var tpl    = document.getElementById('logo-tpl');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============ Logo 3D: capas apiladas ============ */
  var SIDES = 14;
  document.querySelectorAll('[data-logo]').forEach(function (scene) {
    var rig = document.createElement('div');
    rig.className = 'rig';
    function layer(cls, transform) {
      var d = document.createElement('div');
      d.className = 'layer ' + cls;
      d.style.transform = transform;
      d.appendChild(tpl.content.firstElementChild.cloneNode(true));
      rig.appendChild(d);
    }
    for (var i = 0; i < SIDES; i++) {
      layer('side', 'translateZ(calc(var(--t) * ' + (i - (SIDES - 1) / 2) + '))');
    }
    layer('face', 'translateZ(calc(var(--t) * ' + (SIDES / 2) + '))');
    layer('face', 'rotateY(180deg) translateZ(calc(var(--t) * ' + (SIDES / 2) + '))');
    scene.appendChild(rig);
  });

  /* ============ Audio ============ */
  var wantsSound = true;
  try { wantsSound = localStorage.getItem('cvnt-sound') !== 'off'; } catch (e) {}
  var audioOk = true, playing = false, fadeRaf = 0;
  audio.volume = 0;
  audio.addEventListener('error', function () { audioOk = false; render(false); });

  function render(on) {
    playing = on;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    label.textContent = on ? 'SOUND: ON' : 'SOUND: OFF';
  }
  function fade(to, ms, done) {
    cancelAnimationFrame(fadeRaf);
    var from = audio.volume, t0 = performance.now();
    (function step(t) {
      var k = Math.min(1, (t - t0) / ms);
      audio.volume = from + (to - from) * k;
      if (k < 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  function play() {
    if (!audioOk) return Promise.resolve(false);
    return audio.play().then(function () { fade(VOLUME, FADE_MS); render(true); return true; })
                       .catch(function () { render(false); return false; });
  }
  function pause() { fade(0, 600, function () { audio.pause(); }); render(false); }
  function save(v) { try { localStorage.setItem('cvnt-sound', v); } catch (e) {} }

  btn.addEventListener('click', function () {
    if (playing) { wantsSound = false; save('off'); pause(); }
    else { wantsSound = true; save('on'); play(); }
  });

  /* ============ Carga y entrada ============ */
  var domReady = new Promise(function (res) {
    if (document.readyState === 'complete') res(); else window.addEventListener('load', res);
  });
  var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  var minTime = new Promise(function (res) { setTimeout(res, MIN_LOAD_MS); });
  var audioReady = new Promise(function (res) {
    audio.addEventListener('canplaythrough', res, { once: true });
    audio.addEventListener('error', res, { once: true });
    setTimeout(res, 6000);
  });

  function reveal() {
    loader.classList.add('out');
    body.classList.remove('is-loading');
    body.classList.add('ready');
    setTimeout(function () { loader.remove(); }, 1500);
  }

  Promise.all([domReady, fontsReady, minTime, audioReady]).then(function () {
    if (ENTER_GATE) {
      enter.classList.add('show');
      enter.focus({ preventScroll: true });
      enter.addEventListener('click', function () {
        if (wantsSound) play(); else render(false);
        reveal();
      }, { once: true });
    } else {
      reveal();
      if (wantsSound) {
        play().then(function (ok) {
          if (ok) return;
          var kick = function () {
            if (wantsSound && !playing) play();
            ['pointerdown', 'keydown', 'touchend'].forEach(function (ev) { window.removeEventListener(ev, kick); });
          };
          ['pointerdown', 'keydown', 'touchend'].forEach(function (ev) { window.addEventListener(ev, kick, { passive: true }); });
        });
      }
    }
  });

  /* ============ Cursor personalizado (solo con mouse) ============ */
  if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
    var dot = document.getElementById('cur-dot'), shown = false;
    document.documentElement.classList.add('has-cursor');
    window.addEventListener('pointermove', function (e) {
      dot.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
      if (!shown) { shown = true; dot.classList.add('cur-on'); }
      dot.classList.toggle('hot', !!(e.target.closest && e.target.closest('a, button')));
    }, { passive: true });
    document.addEventListener('mouseleave', function () { dot.classList.remove('cur-on'); shown = false; });
  }
})();
</script>
</body>
